name: Release

on:
    # Releases come from master and nowhere else. `release.config.mjs` says the
    # same thing again, so a manual dispatch on a feature branch cannot publish
    # either.
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: write
    # @semantic-release/github comments on the issues and pull requests a
    # release closes.
    issues: write
    pull-requests: write

# No `cancel-in-progress` here, unlike CI. A release is a sequence of
# irreversible pushes — version-bump commit, tag, GitHub release, asset upload —
# and a run killed partway through leaves some of them done and the rest not: a
# tag with no release behind it, or a release with no zip attached. Both have to
# be unwound by hand. The group is still worth having, without cancellation, so
# that two runs cannot race for the same tag.
concurrency:
    group: release

jobs:
    # The gate. `needs: verify` on the release job means nothing below runs until
    # the whole CI workflow has passed on this exact commit — the three typecheck
    # projects, the manifest version-drift check, the suite, the build, and the
    # build-output assertions.
    #
    # Calling CI rather than duplicating it, and calling it rather than keying off
    # its separate run: `workflow_run` fires after the fact and would need the
    # released SHA threaded through by hand, while `needs:` is an ordinary
    # dependency in one run with nothing to get wrong. It is also why CI's own
    # push trigger now skips master — see the comment there.
    #
    # No `if:` here. The release job's `if` already confines publishing to master;
    # this runs on any ref a workflow_dispatch can reach, which is what makes a
    # dispatch on a feature branch report honestly instead of skipping straight to
    # a no-op release job.
    # Named `ci` rather than `verify` only so the check reads `ci / verify` on the
    # commit instead of `verify / verify` — the job inside ci.yml is the one
    # called `verify`.
    ci:
        uses: ./.github/workflows/ci.yml

    release:
        needs: ci
        runs-on: ubuntu-latest
        # Because nothing cancels this workflow, nothing would rescue a hung run
        # from the runner's six-hour default either — and it holds the `release`
        # concurrency lock for the whole time, blocking every release behind it.
        # A full release is a couple of minutes.
        timeout-minutes: 20
        # `push` is already filtered to master; this covers workflow_dispatch,
        # which GitHub allows from any ref.
        if: github.ref == 'refs/heads/master'

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # semantic-release needs the whole history: the last tag to
                  # diff from, and every commit since it to read subjects out of.
                  fetch-depth: 0
                  # semantic-release pushes the release commit and tag itself
                  # using GITHUB_TOKEN. Leaving checkout's credential helper
                  # installed would take that decision away from it.
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: '11'

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The `verify` job has already run the suite and the build on this
            # commit, so these two steps are deliberate duplication, kept for one
            # reason: they are the copy that lives in this file. CI's steps can be
            # narrowed by an edit to ci.yml that looks harmless on its own, and
            # the first thing that would tell anyone is a published release built
            # from untested code. These cost about a minute on a job that runs a
            # handful of times a year.
            #
            # The packaging smoke test below is not duplication — CI does not run
            # it. semantic-release builds the bundles and the zip from its publish
            # step, which runs *after* the release commit and tag have been
            # pushed, so walking that code first is what keeps a failure on the
            # near side of publishing instead of leaving a tag with no assets
            # against it.
            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm run build

            # build-plugin.ts is the only genuinely new code in that publish
            # step. `--dry-run` walks all of it — staging, the metadata and
            # plugin-id derivation, the asset-glob assertion, the archive — and
            # writes into the staging directory it then deletes, so no zip
            # survives to be uploaded next to the real one.
            - name: Smoke-test the release packaging
              run: pnpm exec tsx scripts/build-plugin.ts --dry-run

            - name: Release
              run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
