name: CI

on:
    # Feature branches must be verified before they reach master, not after.
    #
    # master is the one branch excluded, and not because it needs less checking:
    # release.yml calls this workflow as its own first job, so every push to
    # master runs all of it anyway, as the gate the release depends on. Letting
    # the standalone trigger fire there too would put two runs of this workflow
    # on one commit inside the same concurrency group below, where
    # cancel-in-progress kills one of them. Which one is not determined — and if
    # it killed the release's copy, the release would be blocked by a cancelled
    # check rather than a failing one, which is a confusing way to not ship.
    push:
        branches-ignore: [master]
    pull_request:
        branches: [master]
    # Called by release.yml. A release cannot begin until every step below has
    # passed on the very commit being released.
    workflow_call:

permissions:
    contents: read

# A branch under active development gets pushed often; only the newest commit
# needs a verdict.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  # A major-only pin, deliberately loose. No pnpm 10 or 11
                  # release rewrites pnpm-lock.yaml, so --frozen-lockfile holds
                  # across the range and package.json needs no packageManager
                  # field to force a self-switch.
                  version: '11'

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Three typecheck steps, because no one of them subsumes the rest.
            # The package script compiles frontend and webkit as separate
            # programs, each restricted to the ambient @types its runtime
            # actually has — webkit to none, frontend to react. The root project
            # sees every @types at once and so cannot catch a cross-runtime
            # leak, but it is the only project that reaches tests/: vitest
            # strips types through esbuild without checking them, so a test
            # asserting against a mistyped API would otherwise compile and pass
            # forever. The last step re-checks scripts/ under its own config.
            - name: Typecheck frontend and webkit
              run: pnpm run typecheck

            - name: Typecheck tests and shared sources
              run: pnpm exec tsc -p tsconfig.json --noEmit

            - name: Typecheck build scripts
              run: pnpm exec tsc -p scripts/tsconfig.json --noEmit

            # Two files carry the plugin's version and nothing in the build makes
            # them match. A release syncs both, so the drift this catches is a
            # hand-edit to one of them — silent, because the plugin still builds
            # and loads, and only visible once the store shows the stale number.
            - name: Verify package.json and plugin.json agree on version
              run: pnpm exec tsx scripts/sync-version.ts --check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm run build

            # The store's own pipeline runs `pnpm install && pnpm run build` and
            # then expects these paths. Assert them here so a break surfaces on
            # a push instead of during store review. `-s` rather than `-f`: a
            # bundler that exits 0 having written nothing is the failure worth
            # catching.
            #
            # webkitApiVersion is in the key list for a reason the other four are
            # not: its absence is the hardest failure in this project to
            # diagnose. Millennium simply never loads webkit.js — nothing
            # errors, the settings panel still appears and its toggles still
            # persist, and no button is injected into any page. That reads
            # exactly like a selector bug and sends you into
            # webkit/inject-profile.ts looking for a fault that is in the
            # manifest. See docs/ARCHITECTURE.md, "plugin.json must declare
            # webkitApiVersion".
            - name: Verify build output
              run: |
                  test -s .millennium/Dist/index.js
                  test -s .millennium/Dist/webkit.js
                  test -s backend/main.lua
                  node -e "const p=require('./plugin.json'); for (const k of ['name','common_name','version','backendType','webkitApiVersion']) if (!p[k]) throw new Error('plugin.json is missing '+k);"
