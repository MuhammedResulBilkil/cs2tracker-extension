name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem does this solve?
          description: Describe the situation you run into, not the solution you have in mind.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: What should happen instead?
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives you considered
      validations:
          required: false
